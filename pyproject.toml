[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preset-compiler"
version = "0.1.0"
description = "Compile preset source models into BambuStudio artifacts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
preset-compiler = "preset_compiler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
